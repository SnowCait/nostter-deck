name: Release label

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, labeled, unlabeled, edited]

permissions:
  pull-requests: read

concurrency:
  group: release-label-${{ github.event.pull_request.number }}

jobs:
  validate:
    name: Validate release label
    runs-on: ubuntu-latest
    steps:
      - name: Check release labels
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          count=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" | jq '[.labels[].name | select(. == "release:major" or . == "release:minor" or . == "release:patch" or . == "release:none")] | length')
          if [ "$count" -eq 0 ]; then
            echo "::error::Exactly one release label is required; none found."
            exit 1
          elif [ "$count" -gt 1 ]; then
            echo "::error::Exactly one release label is required; found $count."
            exit 1
          fi
          echo "Exactly one release label is present."

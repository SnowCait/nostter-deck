name: Release

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      commit-sha: ${{ github.sha }}
      previous-ref: ${{ steps.version.outputs.previous-ref }}
      first-release: ${{ steps.version.outputs.first-release }}
      release-version: ${{ steps.version.outputs.release-version }}
      release-tag: ${{ steps.version.outputs.release-tag }}
      change-level: ${{ steps.version.outputs.change-level }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: version
        uses: WillAbides/release-train@v3.9.0
        with:
          ref: ${{ github.sha }}
          labels: |
            release:major=semver:breaking
            release:minor=semver:minor
            release:patch=semver:patch
            release:none=semver:none
          initial-release-tag: v1.0.0
          create-tag: false
          create-release: false
      - name: Summarize release plan
        env:
          COMMIT_SHA: ${{ github.sha }}
          PREVIOUS_REF: ${{ steps.version.outputs.previous-ref }}
          FIRST_RELEASE: ${{ steps.version.outputs.first-release }}
          RELEASE_VERSION: ${{ steps.version.outputs.release-version }}
          RELEASE_TAG: ${{ steps.version.outputs.release-tag }}
          CHANGE_LEVEL: ${{ steps.version.outputs.change-level }}
        run: |
          {
            echo '## Release plan'
            printf '\n- Commit: `%s`\n' "$COMMIT_SHA"
            printf -- '- Previous ref: `%s`\n' "$PREVIOUS_REF"
            printf -- '- First release: `%s`\n' "$FIRST_RELEASE"
            printf -- '- Release version: `%s`\n' "$RELEASE_VERSION"
            printf -- '- Release tag: `%s`\n' "$RELEASE_TAG"
            printf -- '- Change level: `%s`\n' "$CHANGE_LEVEL"
          } >> "$GITHUB_STEP_SUMMARY"

  update-version:
    needs: plan
    if: needs.plan.outputs.first-release == 'true' || needs.plan.outputs.change-level != 'none'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit-sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.x'
          package-manager-cache: false
      - name: Check committed version
        id: version
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.release-version }}
        run: |
          current=$(node -p "require('./package.json').version")
          if [[ "$current" == "$RELEASE_VERSION" ]]; then
            echo 'update=false' >> "$GITHUB_OUTPUT"
          else
            echo 'update=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Create GitHub App token
        if: steps.version.outputs.update == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Check release state
        if: steps.version.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          COMMIT_SHA: ${{ needs.plan.outputs.commit-sha }}
        run: |
          set -euo pipefail
          releases=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq -c 'add // []')
          if jq -e 'any(.[]; .draft)' <<< "$releases" >/dev/null; then
            echo 'An unfinished draft release exists.' >&2
            exit 1
          fi

          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$main_sha" != "$COMMIT_SHA" ]]; then
            echo 'The planned commit is no longer main HEAD.' >&2
            exit 1
          fi
      - name: Update version
        if: steps.version.outputs.update == 'true'
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.release-version }}
        run: npm version "$RELEASE_VERSION" --no-git-tag-version
      - name: Create version update pull request
        if: steps.version.outputs.update == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v8.1.3
        with:
          token: ${{ steps.app-token.outputs.token }}
          base: main
          branch: release/version
          add-paths: |
            package.json
            package-lock.json
          sign-commits: true
          commit-message: Update application version to ${{ needs.plan.outputs.release-version }}
          title: Update application version to ${{ needs.plan.outputs.release-version }}
          body: Update the application version to ${{ needs.plan.outputs.release-version }} for the next release.
          labels: release:none
      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          HEAD_SHA: ${{ steps.cpr.outputs.pull-request-head-sha }}
        run: gh pr merge "$PR_NUMBER" --auto --merge --match-head-commit "$HEAD_SHA"

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - run: npm run paraglide:compile
      - run: npm run check
      - run: npm run lint
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  rust:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src-tauri

    steps:
      - uses: actions/checkout@v7.0.1
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked

  desktop-e2e:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - id: install_gsudo
        shell: pwsh
        run: |
          "started_at=$([DateTimeOffset]::UtcNow.ToString('o'))" >> $env:GITHUB_OUTPUT
          winget install --id gerardog.gsudo --exact --version 2.6.1 --source winget --installer-type wix --silent --accept-package-agreements --accept-source-agreements --verbose-logs
      - name: Collect WinGet diagnostic logs
        if: ${{ failure() && steps.install_gsudo.outcome == 'failure' }}
        shell: pwsh
        env:
          INSTALL_STARTED_AT: ${{ steps.install_gsudo.outputs.started_at }}
        run: |
          $ErrorActionPreference = 'Stop'
          $info = winget --info 2>&1 | Out-String
          $logsPathMatch = [regex]::Match($info, '(?m)^\s*Logs:\s*(.+?)\s*$')
          if (-not $logsPathMatch.Success) {
            Write-Warning 'WinGet did not report its diagnostic log directory.'
            exit 0
          }

          $logsDirectory = [Environment]::ExpandEnvironmentVariables($logsPathMatch.Groups[1].Value.Trim())
          if (-not (Test-Path -LiteralPath $logsDirectory -PathType Container)) {
            Write-Warning 'The WinGet diagnostic log directory is unavailable.'
            exit 0
          }

          $startedAt = [DateTimeOffset]::Parse($env:INSTALL_STARTED_AT).UtcDateTime
          $logFiles = Get-ChildItem -LiteralPath $logsDirectory -Filter 'WinGet-*.log' -File -ErrorAction SilentlyContinue |
            Where-Object {
              $_.LastWriteTimeUtc -ge $startedAt -and
              (Select-String -Path $_.FullName -SimpleMatch 'gsudo' -Quiet -ErrorAction SilentlyContinue)
            }
          if (-not $logFiles) {
            Write-Warning 'No WinGet diagnostic logs for the gsudo installation were found.'
            exit 0
          }

          $artifactDirectory = Join-Path $env:RUNNER_TEMP 'winget-gsudo-install-logs'
          New-Item -ItemType Directory -Path $artifactDirectory -Force | Out-Null
          $logFiles | Copy-Item -Destination $artifactDirectory
      - name: Upload WinGet diagnostic logs
        if: ${{ failure() && steps.install_gsudo.outcome == 'failure' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: winget-gsudo-install-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/winget-gsudo-install-logs/
          if-no-files-found: ignore
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.x'
      - run: npm ci
      - run: npm run tauri:build -- --debug --no-bundle --ci
      # High Integrity WebView2 hosts ignore WEBVIEW2_* environment overrides.
      # Run E2E at Medium Integrity to honor them without machine-wide registry policies.
      # https://learn.microsoft.com/en-us/microsoft-edge/webview2/concepts/security
      - run: '& "$env:ProgramFiles\gsudo\Current\gsudo.exe" --direct --integrity Medium npm run test:desktop'

version: 2
multi-ecosystem-groups:
  tauri:
    schedule:
      interval: quarterly
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: quarterly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: quarterly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 30
    ignore:
      - dependency-name: '@tauri-apps/*'
    groups:
      svelte:
        patterns:
          - 'svelte'
          - 'svelte-check'
          - '@sveltejs/*'
        update-types:
          - minor
          - patch
      tailwind:
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/*'
        update-types:
          - minor
          - patch
      eslint:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - 'typescript-eslint'
          - 'globals'
        update-types:
          - minor
          - patch
      prettier:
        patterns:
          - 'prettier'
          - 'prettier-plugin-*'
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: quarterly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: tauri
      - dependency-name: tauri-*

  - package-ecosystem: npm
    directory: /
    cooldown:
      default-days: 7
    patterns:
      - '@tauri-apps/*'
    multi-ecosystem-group: tauri

  - package-ecosystem: cargo
    directory: /src-tauri
    cooldown:
      default-days: 7
    patterns:
      - tauri
      - tauri-*
    multi-ecosystem-group: tauri

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: quarterly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: quarterly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 30
    groups:
      svelte:
        patterns:
          - 'svelte'
          - 'svelte-check'
          - '@sveltejs/*'
        update-types:
          - minor
          - patch
      tauri:
        patterns:
          - '@tauri-apps/*'
        update-types:
          - minor
          - patch
      tailwind:
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/*'
        update-types:
          - minor
          - patch
      eslint:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - 'typescript-eslint'
          - 'globals'
        update-types:
          - minor
          - patch
      prettier:
        patterns:
          - 'prettier'
          - 'prettier-plugin-*'
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: quarterly
    cooldown:
      default-days: 7
    groups:
      tauri:
        patterns:
          - tauri
          - tauri-*
        update-types:
          - minor
          - patch
